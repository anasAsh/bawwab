# Weekly refresh of the top-100 report on GitHub Pages: re-rank, pin, scan with the static rules, republish.
#
# `scan` downloads and reads untrusted packages (never runs them) with a read-only token and no secrets.
# `deploy` only receives the built site. If any scan step fails, deploy does not run and the live site
# stays as it was. Unreviewed findings are published labelled "Not yet reviewed" (--allow-unreviewed);
# add entries to report/review.json and re-run to publish the reviews.
name: report

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      rescan:
        description: "Re-rank and rescan (off: publish the committed report/targets.json + report/results.json as they are)"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: report
  cancel-in-progress: false

env:
  # The code that builds the report.
  SOURCE_REF: main
  # Scheduled runs always re-rank and rescan; a manual run can publish the committed data instead.
  RESCAN: ${{ github.event_name == 'schedule' || inputs.rescan }}
  RESULTS: report/results.json

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # No cache: this job handles hostile downloads, so it saves nothing other runs restore.
          enable-cache: false
      - name: Install
        run: uv sync --locked
      - name: Re-rank and pin the most popular eligible targets
        if: env.RESCAN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Up to 250 MCP servers, 150 skills and 100 plugins: as many as pass the eligibility rules.
        run: uv run python report/collect.py --refresh --mcp 250 --skills 150 --plugins 100
      - name: Check the collect
        # An empty or short list (rate limit, API change) must not replace the live site.
        if: env.RESCAN == 'true'
        run: |
          uv run python -c '
          import collections, sys
          from report import collect
          ts = collect.load_targets(collect.OUT)
          n = collections.Counter(t["kind"] for t in ts)
          print(f"{len(ts)} targets: {dict(n)}")
          sys.exit(0 if n["mcp"] >= 100 and n["skill"] >= 40 and n["plugin"] >= 80 else 1)
          '
      - name: Scan (download only, throwaway HOME)
        if: env.RESCAN == 'true'
        # Outside the real home: on GitHub runners $RUNNER_TEMP is under /home/runner, and scan.py refuses an
        # XDG or work dir inside the real home.
        run: REPORT_PYTHON=.venv/bin/python REPORT_WORK=/var/tmp/bawwab-report-work report/run_scan.sh --out "$RESULTS"
      - name: Build the site
        run: uv run python report/build_site.py --allow-unreviewed --results "$RESULTS"
      - name: List findings awaiting review
        run: |
          uv run python report/needs_review.py --results "$RESULTS"
          cat report/out/needs-review.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: report-data
          path: |
            report/targets.json
            report/results.json
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: report/out/site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
