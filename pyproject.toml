[project]
name = "bawwab"
version = "0.1.4"
description = "Security scanner for MCP servers, Claude Code plugins and Agent Skills: catches malware, prompt injection, tool poisoning and rug-pulls before your AI agent installs them"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Anas Al-Hamdan" }]
keywords = [
    "mcp", "model-context-protocol", "mcp-server", "mcp-security", "claude-code", "claude-code-plugin",
    "agent-skills", "ai-agent-security", "llm-security", "prompt-injection", "tool-poisoning",
    "supply-chain-security", "static-analysis", "security-scanner",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "anthropic>=2.10.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "packaging>=24.0",
    "rapidfuzz>=3.14.6",
    "tree-sitter>=0.26.1",
    "tree-sitter-language-pack>=1.25.2",
]

[project.urls]
Homepage = "https://github.com/anasAsh/bawwab"
Documentation = "https://github.com/anasAsh/bawwab#readme"
"Scan report" = "https://anasash.github.io/bawwab/"
Issues = "https://github.com/anasAsh/bawwab/issues"
Security = "https://github.com/anasAsh/bawwab/blob/main/SECURITY.md"

[project.scripts]
bawwab = "bawwab.cli:main"
bawwab-mcp = "bawwab.mcp_server:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_spawn: allow the test to spawn the real background inventory",
    "real_osv: use the real OSV client (against a fake server) instead of the no-network stub",
    "timing: asserts an absolute time limit (run separately in CI, not blocking)",
    "real_docker: let the test reach the real Docker daemon (deep-mode sandbox)",
    "recall: the malicious-set recall gate (bench/recall_gate.py); offline, runs in CI with -m \"not timing\"",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
]
